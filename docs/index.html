<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bollybuzz.io — 10 Bollywood Trivia Games Where Rare Answers Win</title>
<meta name="description" content="Name one answer per prompt. The rarer your answer, the deeper you dive into 113 years of Hindi cinema." />
<meta name="theme-color" content="#150F38">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root {
--ink: #150F38;              
--ink-tint-top: #241A5C;     
--ink-tint-bottom: #0B0822;  
--ink-raised: #FFFFFF;       
--ink-sunk: #F3F1FA;         
--ink-deep: #E4E0F2;         
--paper: #FFFFFF;
--paper-shade: #F5F2FC;
--paper-rule: #D6D0EA;
--marigold: #FFB01F;
--marigold-deep: #E09000;
--rani: #E01067;
--rani-deep: #B80E56;
--violet: #7C1D9E;           
--peacock: #0E7C86;          
--peacock-deep: #0A626A;
--magenta: #E01067;          
--magenta-deep: #B80E56;
--vermilion: #E8425A;        
--on-paper: #16112E;         
--on-paper-dim: #5C5578;     
--on-ink: #F2EEFF;           
--on-ink-dim: #B4AAD8;
--bulb: #FFE9A8;
--bulb-halo: rgba(255, 176, 31, .55);
--tier-common: #8E88A8;      
--tier-known: #2E86DE;
--tier-solid: #7C4DFF;
--tier-deepcut: #FFB01F;
--tier-legendary: #E01067;
--tier-miss: #C7C1DC;
--font-display: 'Rozha One', 'Georgia', 'Times New Roman', serif;
--font-body: 'Hind', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
--font-mono: 'DM Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
--t-mega: clamp(34px, 8vw, 52px);
--t-prompt: clamp(23px, 5vw, 32px);
--t-colossal: clamp(46px, 12vw, 76px);
--t-body: 15px;
--t-small: 13px;
--t-micro: 12px;
--radius: 12px;
--radius-sm: 8px;
--shadow-card: 0 2px 10px rgba(0, 0, 0, .38);
--shadow-raised: 0 10px 30px rgba(0, 0, 0, .45);
--rule: 1px solid var(--paper-rule);
--rule-thin: 1px solid var(--ink-deep);
--s-1: 4px;
--s-2: 8px;
--s-3: 12px;
--s-4: 16px;
--s-5: 24px;
--s-6: 32px;
--s-7: 48px;
--ease-press: cubic-bezier(.2, .8, .2, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
min-height: 100vh;
font-family: var(--font-body);
font-size: var(--t-body);
color: var(--on-ink);
background-color: var(--ink);
background-image: linear-gradient(
170deg,
var(--ink-tint-top) 0%,
var(--ink) 45%,
var(--ink-tint-bottom) 100%
);
background-attachment: fixed;
display: flex;
justify-content: center;
padding: var(--s-5) var(--s-4) var(--s-7);
position: relative;
overflow-x: hidden;
-webkit-font-smoothing: antialiased;
}
.wrap {
width: 100%;
max-width: 620px;
position: relative;
z-index: 1;
}
header.top {
position: relative;
text-align: center;
margin-bottom: var(--s-4);
padding: var(--s-6) var(--s-5) var(--s-4);
background: var(--paper);
border-radius: var(--radius);
box-shadow: var(--shadow-card);
overflow: hidden;
}
.bulbs {
position: absolute;
top: 0;
left: 0;
right: 0;
height: 14px;
background-image:
radial-gradient(circle at 10px 7px, var(--bulb) 0 2.5px, transparent 3px),
radial-gradient(circle at 10px 7px, var(--bulb-halo) 0 5px, transparent 8px);
background-size: 20px 14px, 20px 14px;
background-repeat: repeat-x;
animation: flicker 4s ease-in-out infinite;
}
@keyframes flicker {
0%, 100% { opacity: 1; }
50% { opacity: .82; }
}
.sound-toggle {
position: absolute;
top: var(--s-3);
right: var(--s-3);
display: inline-flex;
align-items: center;
gap: 6px;
padding: 7px 12px;
background: var(--ink-deep);
border: none;
border-radius: var(--radius-sm);
color: var(--on-paper);
font-family: var(--font-body);
font-size: var(--t-small);
font-weight: 600;
transition: background .14s var(--ease-press);
}
.sound-toggle:hover { background: var(--paper-rule); }
.sound-toggle svg {
width: 15px;
height: 15px;
fill: none;
stroke: currentColor;
stroke-width: 1.6;
stroke-linecap: round;
stroke-linejoin: round;
flex-shrink: 0;
}
@media (max-width: 520px) {
.sound-toggle .st-label { display: none; }
}
.kicker {
font-size: var(--t-small);
color: var(--on-paper-dim);
display: block;
}
.wordmark {
position: relative;
display: block;
font-family: var(--font-display);
font-weight: 400;          
font-size: var(--t-mega);
line-height: 1.05;
letter-spacing: .005em;
margin: var(--s-2) 0 var(--s-3);
color: var(--on-paper);
}
.wm-ghost {
position: absolute;
inset: 0;
display: block;
z-index: 0;
}
.wm-ghost--peacock { color: var(--peacock); transform: translate(-2px, 1px); }
.wm-ghost--magenta { color: var(--rani); transform: translate(2px, -1px); }
.wm-main { position: relative; z-index: 1; }
.tagline {
color: var(--on-paper-dim);
font-size: var(--t-body);
line-height: 1.5;
margin: 0 auto;
max-width: 46ch;
}
.tagline b { color: var(--on-paper); font-weight: 600; }
footer.about {
margin-top: var(--s-4);
padding: var(--s-4);
background: var(--paper);
border-radius: var(--radius);
box-shadow: var(--shadow-card);
text-align: center;
font-size: var(--t-small);
color: var(--on-paper-dim);
line-height: 1.5;
}
.hidden { display: none !important; }
:focus-visible {
outline: 2px solid var(--peacock);
outline-offset: 2px;
}
@media (forced-colors: active) {
.lr-bar i,
.fb-tier,
.bd-sq,
.timer-fill,
.pdot.done,
.pdot.now,
.gauge-travelled,
.gauge-marker,
.gauge-marker::after {
forced-color-adjust: none;
}
}
@media (prefers-reduced-motion: reduce) {
*, *::before, *::after {
animation-duration: .001ms !important;
animation-iteration-count: 1 !important;
transition-duration: .001ms !important;
}
}
.card {
position: relative;
background: var(--paper);
color: var(--on-paper);
border: none;
border-radius: var(--radius);
padding: var(--s-5);
box-shadow: var(--shadow-card);
}
.card::before { display: none; }
.card > * { position: relative; }
.card--screen {
background: var(--paper);
color: var(--on-paper);
padding-top: var(--s-5);
border-top: none;
overflow: hidden;
}
.card--screen::after {
content: "";
position: absolute;
top: 0;
left: 0;
right: 0;
height: 4px;
background: linear-gradient(
90deg,
var(--peacock) 0 25%,
var(--rani) 25% 50%,
var(--marigold) 50% 75%,
var(--violet) 75% 100%
);
}
.card + .card { margin-top: var(--s-4); }
button {
font-family: var(--font-body);
cursor: pointer;
border: none;
border-radius: var(--radius-sm);
}
.btn-primary,
.btn-gold {
font-family: var(--font-body);
font-weight: 600;
font-size: var(--t-body);
padding: 10px var(--s-5);
border-radius: var(--radius-sm);
background: var(--peacock);
color: #FFFFFF;
white-space: nowrap;
transition: background .14s var(--ease-press);
}
.btn-primary:hover:not(:disabled),
.btn-gold:hover:not(:disabled) { background: var(--peacock-deep); }
.btn-primary:active:not(:disabled),
.btn-gold:active:not(:disabled) { background: var(--peacock-deep); }
.btn-primary:disabled,
.btn-gold:disabled { opacity: .45; cursor: not-allowed; }
.btn-ghost {
background: var(--ink-deep);
color: var(--on-paper);
padding: 10px var(--s-5);
border-radius: var(--radius-sm);
font-size: var(--t-body);
font-weight: 600;
transition: background .14s var(--ease-press);
}
.btn-ghost:hover { background: var(--paper-rule); }
.linklike {
background: none;
border: none;
padding: 4px 6px;
border-radius: var(--radius-sm);
font-family: var(--font-body);
font-size: var(--t-small);
font-weight: 600;
color: var(--on-paper-dim);
text-decoration: none;
}
.linklike:hover:not(:disabled) { background: var(--ink-deep); color: var(--on-paper); }
.linklike:disabled { opacity: .45; cursor: not-allowed; }
.card--screen .linklike { color: var(--on-paper-dim); }
.card--screen .linklike:hover:not(:disabled) { color: var(--on-paper); }
.hero-btn {
position: relative;
display: grid;
grid-template-columns: minmax(0, 1fr) auto;
align-items: center;
gap: var(--s-4);
width: 100%;
text-align: left;
padding: var(--s-6) var(--s-5);
margin-bottom: var(--s-5);
background:
repeating-linear-gradient(
115deg,
rgba(255, 255, 255, .07) 0 2px,
transparent 2px 22px
),
linear-gradient(135deg, var(--rani) 0%, var(--violet) 100%);
border-radius: var(--radius);
color: #FFFFFF;
box-shadow: 0 6px 22px rgba(224, 16, 103, .38);
overflow: hidden;
transition: box-shadow .16s var(--ease-press), transform .16s var(--ease-press);
}
.hero-btn::before, .hero-btn::after { display: none; }
.hero-btn:hover {
box-shadow: 0 12px 34px rgba(224, 16, 103, .5);
transform: translateY(-2px);
}
.hero-btn:active { transform: translateY(0); }
.hero-btn:focus-visible { outline-color: var(--marigold); outline-offset: 3px; }
.hb-main { min-width: 0; }
.hb-rule {
display: block;
font-size: var(--t-small);
font-weight: 700;
letter-spacing: .06em;
text-transform: uppercase;
color: rgba(255, 255, 255, .85);
}
.hb-title {
display: block;
font-family: var(--font-display);
font-weight: 400;
font-size: clamp(34px, 8.5vw, 50px);
line-height: 1.02;
letter-spacing: .01em;
margin: var(--s-2) 0 var(--s-2);
text-shadow: 2px 2px 0 rgba(0, 0, 0, .22);
}
.hb-desc {
display: block;
font-size: var(--t-body);
line-height: 1.5;
color: rgba(255, 255, 255, .92);
}
.hb-go {
font-family: var(--font-body);
font-size: 17px;
font-weight: 700;
padding: 14px var(--s-6);
border-radius: var(--radius-sm);
background: var(--marigold);
color: #241503;
white-space: nowrap;
box-shadow: 0 0 0 rgba(255, 176, 31, 0);
transition: box-shadow .16s var(--ease-press), background .16s var(--ease-press);
}
.hero-btn:hover .hb-go {
background: #FFC24E;
box-shadow: 0 0 22px rgba(255, 176, 31, .65);
}
.mode-btn,
.pack-btn {
background: var(--paper);
border: 1px solid var(--paper-rule);
border-radius: var(--radius);
text-align: left;
color: var(--on-paper);
font-family: var(--font-body);
transition: background .14s var(--ease-press), border-color .14s var(--ease-press),
box-shadow .14s var(--ease-press);
}
.mode-btn { padding: var(--s-4); }
.pack-btn {
position: relative;
padding: var(--s-3) var(--s-4) var(--s-3) calc(var(--s-4) + 6px);
transform: none;
}
.mode-btn:hover,
.pack-btn:hover,
.pack-btn:focus-visible {
background: var(--paper-shade);
border-color: var(--paper-rule);
box-shadow: var(--shadow-card);
transform: none;
}
.pack-btn::before {
content: "";
position: absolute;
left: 0;
top: 0;
bottom: 0;
width: 4px;
border-radius: var(--radius) 0 0 var(--radius);
background: var(--tier-common);
}
.pack-btn:nth-child(5n+2)::before { background: var(--tier-known); }
.pack-btn:nth-child(5n+3)::before { background: var(--tier-solid); }
.pack-btn:nth-child(5n+4)::before { background: var(--tier-deepcut); }
.pack-btn:nth-child(5n+5)::before { background: var(--tier-legendary); }
.mode-btn .mtitle { font-weight: 700; font-size: 17px; line-height: 1.2; }
.mode-btn .mdesc { color: var(--on-paper-dim); font-size: var(--t-small); margin-top: var(--s-2); line-height: 1.45; }
.mode-btn .mrule {
font-size: var(--t-micro);
font-weight: 600;
text-transform: uppercase;
color: var(--peacock);
display: block;
margin-bottom: var(--s-1);
}
.pack-btn .ptitle { font-weight: 600; font-size: 15px; line-height: 1.3; }
.pack-btn .pdesc { color: var(--on-paper-dim); font-size: var(--t-small); margin-top: 2px; }
.eyebrow {
font-size: var(--t-micro);
font-weight: 600;
letter-spacing: .04em;
text-transform: uppercase;
color: var(--on-paper-dim);
}
.card--screen .eyebrow { color: var(--peacock); }
.section-label {
display: flex;
align-items: center;
gap: var(--s-3);
margin: var(--s-5) 0 var(--s-3);
}
.section-label .line { flex: 1; height: 1px; background: var(--ink-deep); opacity: 1; }
.section-label span {
font-size: var(--t-small);
font-weight: 700;
color: var(--on-paper);
white-space: nowrap;
}
.section-label .sl-note { color: var(--on-paper-dim); font-weight: 400; }
input#answerInput {
flex: 1;
min-width: 0;
padding: 11px var(--s-4);
border: 1px solid var(--paper-rule);
border-radius: 20px;
background: var(--ink-sunk);
color: var(--on-paper);
font-size: 16px;
font-family: var(--font-body);
outline: none;
transition: border-color .14s var(--ease-press), background .14s var(--ease-press);
}
input#answerInput::placeholder { color: var(--on-paper-dim); }
input#answerInput:focus { border-color: var(--peacock); background: var(--paper); }
input#answerInput:disabled { opacity: .6; }
#screen-start > * {
animation: paste-up .34s var(--ease-press) both;
}
#screen-start > *:nth-child(1) { animation-delay: .02s; }
#screen-start > *:nth-child(2) { animation-delay: .07s; }
#screen-start > *:nth-child(3) { animation-delay: .12s; }
#screen-start > *:nth-child(4) { animation-delay: .17s; }
#screen-start > *:nth-child(5) { animation-delay: .22s; }
#screen-start > *:nth-child(6) { animation-delay: .27s; }
@keyframes paste-up {
from { opacity: 0; transform: translateY(7px); }
to { opacity: 1; transform: none; }
}
.howto {
margin: var(--s-3) 0 0;
font-size: var(--t-body);
color: var(--on-paper);
line-height: 1.65;
max-width: 54ch;
}
.howto b { font-weight: 600; }
.howto em {
font-style: normal;
padding: 1px 4px;
background: linear-gradient(100deg, rgba(255, 176, 31, .42), rgba(255, 176, 31, .68));
border-radius: 3px;
box-decoration-break: clone;
-webkit-box-decoration-break: clone;
}
.ladder { margin-top: var(--s-5); }
.ladder-head {
display: flex;
justify-content: space-between;
align-items: baseline;
gap: var(--s-3);
padding-bottom: var(--s-2);
border-bottom: var(--rule);
}
.ladder-axis {
font-family: var(--font-mono);
font-size: var(--t-micro);
letter-spacing: .12em;
text-transform: uppercase;
color: var(--on-paper-dim);
}
.ladder-rows { list-style: none; margin: 0; padding: 0; }
.ladder-row {
display: grid;
grid-template-columns: 78px minmax(0, 1fr) auto;
align-items: center;
gap: var(--s-3);
padding: 9px 0;
border-bottom: var(--rule-thin);
}
.ladder-row:last-child { border-bottom: none; }
.lr-bar {
height: 12px;
background: var(--ink-deep);
display: block;
border-radius: 2px;
overflow: hidden;
}
.lr-bar i {
display: block;
height: 100%;
transform-origin: left center;
animation: bar-draw .7s var(--ease-press) both;
box-shadow: inset 0 -3px 6px rgba(0, 0, 0, .18);
}
@keyframes bar-draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.lr-name {
font-weight: 600;
font-size: 14.5px;
line-height: 1.25;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
}
.lr-tier {
display: block;
font-family: var(--font-mono);
font-size: var(--t-micro);
color: var(--on-paper-dim);
letter-spacing: .04em;
}
.lr-pts {
font-family: var(--font-mono);
font-size: 16px;
font-weight: 500;
white-space: nowrap;
}
.ladder-foot {
margin: var(--s-3) 0 0;
font-size: var(--t-small);
color: var(--on-paper-dim);
}
.ladder-foot b { color: var(--on-paper); font-weight: 600; }
.programme { margin-top: var(--s-6); counter-reset: show; }
.show-btn {
counter-increment: show;
position: relative;
display: grid;
grid-template-columns: auto minmax(0, 1fr) auto;
align-items: center;
gap: var(--s-3);
width: 100%;
text-align: left;
padding: var(--s-3) var(--s-2) var(--s-3) 0;
background: transparent;
border: none;
border-bottom: var(--rule-thin);
color: var(--on-paper);
font-family: var(--font-body);
transition: background .14s var(--ease-press), color .14s var(--ease-press),
padding-left .14s var(--ease-press);
}
.show-btn::before {
content: counter(show, decimal-leading-zero);
font-family: var(--font-mono);
font-size: var(--t-small);
letter-spacing: .06em;
color: var(--paper-rule);
padding-left: var(--s-2);
transition: color .14s var(--ease-press);
}
.show-btn::after {
content: "";

left: 0;
top: 6px;
bottom: 6px;
width: 4px;
border-radius: 0 2px 2px 0;
background: var(--peacock);
transform: scaleY(.45);
transform-origin: center;
transition: transform .18s var(--ease-press);
}
.show-btn:nth-child(2)::after { background: var(--rani); }
.show-btn:nth-child(3)::after { background: var(--marigold); }
.show-btn:nth-child(4)::after { background: var(--violet); }
.show-btn:last-child { border-bottom: var(--rule); }
.show-btn:hover,
.show-btn:focus-visible { background: var(--paper-shade); padding-left: var(--s-2); }
.show-btn:hover::after,
.show-btn:focus-visible::after { transform: scaleY(1); }
.show-btn:hover::before,
.show-btn:focus-visible::before { color: var(--peacock); }
.show-btn:hover .sb-blurb, .show-btn:hover .sb-rounds { color: var(--on-paper-dim); }
.sb-main { min-width: 0; }
.sb-name {
display: block;
font-family: var(--font-display);
font-size: 22px;
line-height: 1.15;
}
.sb-blurb {
display: block;
font-size: var(--t-small);
color: var(--on-paper-dim);
margin-top: 2px;
line-height: 1.4;
}
.sb-rounds {
font-family: var(--font-mono);
font-size: var(--t-micro);
letter-spacing: .08em;
text-transform: uppercase;
color: var(--on-paper-dim);
white-space: nowrap;
}
.archive-list { list-style: none; margin: 0; padding: 0; }
.archive-btn {

grid-template-columns: minmax(0, 1fr) auto auto;
align-items: baseline;
gap: var(--s-3);
width: 100%;
text-align: left;
padding: 10px var(--s-2);
background: transparent;
border: none;
border-bottom: var(--rule-thin);
color: var(--on-paper);
font-family: var(--font-body);
cursor: pointer;
transition: background .14s var(--ease-press), padding-left .14s var(--ease-press);
}
.archive-list li:last-child .archive-btn { border-bottom: var(--rule); }
.archive-btn:hover,
.archive-btn:focus-visible { background: var(--paper-shade); padding-left: var(--s-3); }
.ab-date {
font-family: var(--font-mono);
font-size: var(--t-small);
letter-spacing: .04em;
}
.ab-score {
font-family: var(--font-mono);
font-size: var(--t-micro);
color: var(--peacock);

}
.ab-new,
.ab-go {
font-family: var(--font-mono);
font-size: var(--t-micro);
color: var(--on-paper-dim);
white-space: nowrap;
}
.ab-go { letter-spacing: .08em; text-transform: uppercase; }
.archive-btn:hover .ab-go,
.archive-btn:focus-visible .ab-go { color: var(--peacock); }

.pack-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); }
@media (max-width: 520px) {
.pack-grid { grid-template-columns: 1fr; }
.card { padding: var(--s-4) var(--s-4) var(--s-5); }
.ladder-row { grid-template-columns: 52px minmax(0, 1fr) auto; }
.sb-name { font-size: 19px; }
.archive-btn { grid-template-columns: minmax(0, 1fr) auto; }
.ab-go { display: none; }
.hero-btn { grid-template-columns: 1fr; gap: var(--s-4); padding: var(--s-5) var(--s-4); }
.hb-go { display: block; text-align: center; padding: 13px var(--s-4); }
}
.hud {
display: flex;
justify-content: space-between;
align-items: baseline;
font-family: var(--font-mono);
font-size: var(--t-micro);
letter-spacing: .1em;
text-transform: uppercase;
color: var(--on-ink-dim);
margin-bottom: var(--s-3);
}
.hud b { color: var(--peacock); font-weight: 500; }
.timer { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-5); }
.timer-track {
position: relative;
flex: 1;
height: 14px;
background: var(--ink-sunk);
border: 1px solid var(--paper-rule);
overflow: hidden;
}
.timer-fill {
height: 100%;
background: var(--peacock);
transition: width 1s linear, background-color .3s ease;
}
.timer-track::after {
content: "";
position: absolute;
inset: 0;
background: repeating-linear-gradient(90deg,
transparent 0 calc(var(--tick) - 2px), var(--paper) calc(var(--tick) - 2px) var(--tick));
pointer-events: none;
}
.timer-count {
font-family: var(--font-mono);
font-size: var(--t-small);
color: var(--on-ink-dim);
min-width: 4ch;
text-align: right;
}
.timer--low .timer-fill { background: var(--vermilion); }
.timer--low .timer-count { color: var(--vermilion); }
.cat-label { text-align: center; }
.cat-label .cl-kicker {
font-family: var(--font-mono);
font-size: var(--t-micro);
letter-spacing: .18em;
text-transform: uppercase;
color: var(--peacock);
}
.cat-label h2 {
font-family: var(--font-display);
font-weight: 700;
font-size: var(--t-prompt);
line-height: 1.2;
letter-spacing: -.01em;
margin: var(--s-3) 0 var(--s-2);
color: var(--on-paper);
}
.cat-label .cl-limit {
display: inline-block;
margin: 0 auto var(--s-2);
padding: 5px var(--s-3);
border-radius: 999px;
background: #DDF0F1;
color: var(--peacock-deep);
font-size: var(--t-small);
font-weight: 700;
}
.cat-label .cl-hint { color: var(--on-paper-dim); font-size: var(--t-small); }
.answer-row { display: flex; gap: var(--s-2); margin-top: var(--s-5); }
.skip-row { text-align: center; margin-top: var(--s-3); }
.retry-note {
margin-top: var(--s-4);
padding: var(--s-3) var(--s-4);
border-left: 3px solid var(--vermilion);
background: #FDE6EE;
color: var(--magenta-deep);
font-size: var(--t-small);
line-height: 1.5;
animation: nudge .3s var(--ease-press);
}
@keyframes nudge {
0% { transform: translateX(-5px); }
60% { transform: translateX(3px); }
100% { transform: translateX(0); }
}
.feedback {
margin-top: var(--s-5);
padding: var(--s-4);
background: var(--ink-sunk);
border: 1px solid var(--paper-rule);
animation: settle .35s var(--ease-press) both;
}
@keyframes settle { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.fb-top { display: flex; justify-content: space-between; align-items: center; gap: var(--s-3); }
.fb-tier {
font-family: var(--font-mono);
font-size: var(--t-small);
font-weight: 500;
letter-spacing: .08em;
text-transform: uppercase;
padding: 5px var(--s-3);
color: var(--ink);
}
.fb-points {
font-family: var(--font-display);
font-size: 34px;
line-height: 1;
color: var(--marigold);
}
.fb-matched { margin-top: var(--s-3); font-size: var(--t-body); line-height: 1.6; }
.fb-matched span {
font-family: var(--font-mono);
font-size: var(--t-micro);
letter-spacing: .1em;
text-transform: uppercase;
color: var(--on-ink-dim);
}
.fb-correction {
margin-top: var(--s-3);
font-size: var(--t-small);
border-left: 3px solid var(--marigold);
background: #FEF5DC;
padding: var(--s-2) var(--s-3);
color: #8A6100;
line-height: 1.5;
}
.fb-correction b { color: var(--on-paper); }
.fb-actions { text-align: center; margin-top: var(--s-4); }
.progress-dots { display: flex; justify-content: center; gap: var(--s-1); margin-top: var(--s-5); }
.pdot { width: 22px; height: 4px; border-radius: 2px; background: var(--ink-deep); }
.pdot.done { background: var(--peacock); }
.pdot.now { background: var(--magenta); }
.back-row { text-align: center; margin-top: var(--s-4); }
.result-head { text-align: center; }
.result-head .rh-game {
font-family: var(--font-mono);
font-size: var(--t-micro);
letter-spacing: .16em;
text-transform: uppercase;
color: var(--magenta);
}
.gauge {
display: flex;
gap: var(--s-5);
align-items: stretch;
margin: var(--s-5) 0 var(--s-4);
}
.gauge-rail {
position: relative;
width: 66px;
flex-shrink: 0;
border-left: 2px solid var(--paper-rule);
}
.gauge-travelled {
position: absolute;
left: -2px;
top: 0;
width: 14px;
background: var(--magenta);
-webkit-mask-image: repeating-linear-gradient(180deg, #000 0 9px, transparent 9px 13px);
mask-image: repeating-linear-gradient(180deg, #000 0 9px, transparent 9px 13px);
animation: descend .9s var(--ease-press) both;
}
@keyframes descend { from { height: 0; } }
.gauge-tick {
position: absolute;
left: 16px;
display: flex;
align-items: center;
gap: 6px;
transform: translateY(-50%);
font-family: var(--font-mono);
font-size: var(--t-micro);
color: var(--on-paper-dim);
white-space: nowrap;
}
.gauge-tick::before { content: ""; width: 10px; height: 1px; background: var(--paper-rule); }
.gauge-marker {
position: absolute;
left: -6px;
z-index: 2;
width: 34px;
height: 4px;
background: var(--vermilion);
transform: translateY(-50%);
animation: descend-marker .9s var(--ease-press) both;
}
.gauge-marker::after {
content: "";
position: absolute;
right: -5px;
top: -3px;
border: 5px solid transparent;
border-left-color: var(--vermilion);
}
@keyframes descend-marker { from { top: 0; opacity: 0; } }
.gauge-readout { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.depth-year {
font-family: var(--font-display);
font-size: var(--t-colossal);
line-height: .84;
letter-spacing: -.02em;
color: var(--on-paper);
}
.depth-era { font-size: var(--t-body); font-weight: 600; margin-top: var(--s-2); line-height: 1.3; }
.depth-note { font-size: var(--t-small); color: var(--on-paper-dim); margin-top: var(--s-2); line-height: 1.5; }
.depth-note b { font-family: var(--font-mono); font-weight: 500; color: var(--on-paper); }
.score-band {
display: grid;
grid-template-columns: 1fr auto;
align-items: baseline;
column-gap: var(--s-3);
margin-top: var(--s-5);
padding: var(--s-3) 0 var(--s-2);
border-top: var(--rule);
border-bottom: var(--rule);
}
.score-max {
font-family: var(--font-mono);
font-size: var(--t-micro);
letter-spacing: .1em;
text-transform: uppercase;
color: var(--on-paper-dim);
text-align: right;
white-space: nowrap;
}
.score-value {
grid-column: 1 / -1;
font-family: var(--font-display);
font-size: clamp(38px, 10vw, 54px);
line-height: 1.05;
color: var(--magenta-deep);
}
.score-unit {
font-family: var(--font-body);
font-size: 17px;
font-weight: 600;
color: var(--on-paper-dim);
margin-left: 6px;
}
.breakdown { margin-top: var(--s-2); }
.bd-row {
display: grid;
grid-template-columns: 12px minmax(0, 1fr) auto;
align-items: start;
gap: var(--s-3);
padding: 10px 0;
border-bottom: var(--rule-thin);
}
.bd-sq { width: 12px; height: 12px; border-radius: 2px; margin-top: 3px; }
.bd-alts {
display: flex;
flex-wrap: wrap;
align-items: center;
gap: 4px 10px;
margin-top: 5px;
}
.bd-alts-label {
font-size: var(--t-micro);
font-weight: 600;
letter-spacing: .03em;
text-transform: uppercase;
color: var(--on-paper-dim);
}
.bd-alt {
display: inline-flex;
align-items: center;
gap: 5px;
font-size: var(--t-small);
color: var(--on-paper-dim);
white-space: nowrap;
}
.bd-alt i {
width: 8px;
height: 8px;
border-radius: 2px;
flex-shrink: 0;
}
.bd-alt b {
font-weight: 600;
color: var(--on-paper);
font-variant-numeric: tabular-nums;
}
.bd-main { min-width: 0; }
.bd-cat {
font-family: var(--font-mono);
font-size: var(--t-micro);
color: var(--on-paper-dim);
letter-spacing: .04em;
}
.bd-ans { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-pts { font-family: var(--font-mono); font-size: 15px; white-space: nowrap; }

margin-top: var(--s-5);
padding: var(--s-4);
background: var(--paper-shade);
border: var(--rule-thin);
font-family: var(--font-mono);
font-size: var(--t-small);

line-height: 1.6;

}
.actions { display: flex; gap: var(--s-2); margin-top: var(--s-4); flex-wrap: wrap; }
.actions > * { flex: 1 1 160px; text-align: center; }

<body>
<div class="wrap" id="root"><p class="boot">Loading Bollybuzz.io</p></div>
<script>
/**
 * mini-react — the small part of React this game actually uses.
 * ---------------------------------------------------------------------------
 * Exposes the same two globals the app was written against, so nothing in
 * src/js/ has to change:
 *
 *   window.React            createElement, Fragment, useState, useEffect, useRef
 *   window.ReactDOMClient   createRoot(container).render(element)
 *
 * Why this exists: React's own build is ~460KB of the ~546KB single-file
 * bundle, and Claude's Artifact host stops rendering a page once it has that
 * much real code to process. The app only ever touched the six APIs above and
 * uses no JSX, so the honest fix was to implement those six rather than ship a
 * general-purpose library to use a corner of it. The bundle drops to ~90KB.
 *
 * What it deliberately does NOT do: concurrent rendering, error boundaries,
 * class components, context, portals, memo, or the synthetic event system.
 * Events are attached with addEventListener, with one React-ism preserved:
 * `onChange` binds to the native `input` event, because that is the React
 * semantic the answer box was written against.
 *
 * Updates are diffed rather than re-created, which is not an optimisation
 * here — it is what keeps the answer box focused and the caret in place while
 * the player types.
 */
(function () {
  'use strict';

  var SVG_NS = 'http://www.w3.org/2000/svg';
  var Fragment = { fragment: true };

  /* -------------------------------------------------------------------------
     Elements
  ------------------------------------------------------------------------- */

  /**
   * Children arrive as a rest argument and may nest arrays (every `.map()` in
   * the UI produces one). They are flattened once here so the reconciler only
   * ever sees a flat list, and nullish/boolean children are dropped the way
   * React drops them — `cond ? h(...) : null` is used throughout.
   */
  function flatten(list, out) {
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      if (c === null || c === undefined || c === false || c === true) continue;
      if (Array.isArray(c)) flatten(c, out);
      else out.push(c);
    }
    return out;
  }

  function createElement(type, props) {
    var rest = [];
    for (var i = 2; i < arguments.length; i++) rest.push(arguments[i]);
    props = props || {};

    var clean = {};
    for (var k in props) {
      if (k !== 'key' && k !== 'ref') clean[k] = props[k];
    }
    return {
      type: type,
      props: clean,
      key: props.key === undefined || props.key === null ? null : String(props.key),
      ref: props.ref || null,
      children: flatten(rest, []),
    };
  }

  function keyOf(vnode) {
    return typeof vnode === 'object' ? vnode.key : null;
  }

  /** The identity used to decide "same node, update it" vs "replace it". */
  function typeOf(vnode) {
    return typeof vnode === 'object' ? vnode.type : '#text';
  }

  /* -------------------------------------------------------------------------
     Hooks

     Hook state lives on the component instance, addressed by call order, which
     is why the rules of hooks exist. `current` is set for exactly the duration
     of one component call.
  ------------------------------------------------------------------------- */

  var current = null;
  var hookIndex = 0;
  var pendingEffects = [];

  function slot(initialise) {
    var hooks = current.hooks;
    var i = hookIndex++;
    if (hooks.length <= i) hooks.push(initialise());
    return hooks[i];
  }

  function useState(initial) {
    var inst = current;
    var hook = slot(function () {
      return { value: typeof initial === 'function' ? initial() : initial };
    });
    if (!hook.set) {
      hook.set = function (next) {
        var value = typeof next === 'function' ? next(hook.value) : next;
        // Bailing on an unchanged value keeps a re-render out of the way of
        // the caret when a keystroke produces the same string.
        if (Object.is(value, hook.value)) return;
        hook.value = value;
        schedule(inst.root);
      };
    }
    return [hook.value, hook.set];
  }

  function useRef(initial) {
    return slot(function () { return { current: initial }; });
  }

  function useEffect(fn, deps) {
    var hook = slot(function () { return { deps: null, cleanup: null, fresh: true }; });
    var changed =
      hook.fresh ||
      !deps ||
      !hook.deps ||
      deps.length !== hook.deps.length ||
      deps.some(function (d, i) { return !Object.is(d, hook.deps[i]); });

    if (changed) {
      hook.fresh = false;
      hook.deps = deps ? deps.slice() : null;
      pendingEffects.push({ hook: hook, fn: fn });
    }
  }

  /** Run after the DOM is committed, previous cleanup first, as React does. */
  function flushEffects() {
    var queue = pendingEffects;
    pendingEffects = [];
    for (var i = 0; i < queue.length; i++) {
      var e = queue[i];
      runCleanup(e.hook);
      var result = e.fn();
      e.hook.cleanup = typeof result === 'function' ? result : null;
    }
  }

  function runCleanup(hook) {
    if (typeof hook.cleanup === 'function') {
      try { hook.cleanup(); } catch (err) { /* a failed cleanup must not stop the render */ }
      hook.cleanup = null;
    }
  }

  /* -------------------------------------------------------------------------
     Props
  ------------------------------------------------------------------------- */

  // Attribute names that differ from the prop names the app writes.
  var ALIAS = {
    className: 'class',
    autoComplete: 'autocomplete',
    autoCorrect: 'autocorrect',
    autoCapitalize: 'autocapitalize',
    htmlFor: 'for',
    tabIndex: 'tabindex',
    inputMode: 'inputmode',
    maxLength: 'maxlength',
    spellCheck: 'spellcheck',
    readOnly: 'readonly',
  };

  // These must be set as DOM properties, not attributes: an attribute only
  // seeds the initial value and would leave the live input out of sync.
  var AS_PROPERTY = { value: 1, checked: 1, disabled: 1, selected: 1 };

  function isHandler(name) {
    return name.charCodeAt(0) === 111 && name.charCodeAt(1) === 110; // "on"
  }

  function eventName(name) {
    var n = name.slice(2).toLowerCase();
    // React's onChange fires per keystroke; the native equivalent is `input`.
    return n === 'change' ? 'input' : n;
  }

  function setStyleValue(dom, key, value) {
    if (key.charCodeAt(0) === 45) dom.style.setProperty(key, value); // custom property
    else dom.style[key] = value === null || value === undefined ? '' : value;
  }

  function applyStyle(dom, oldStyle, newStyle) {
    oldStyle = oldStyle || {};
    newStyle = newStyle || {};
    for (var a in oldStyle) if (!(a in newStyle)) setStyleValue(dom, a, '');
    for (var b in newStyle) if (oldStyle[b] !== newStyle[b]) setStyleValue(dom, b, newStyle[b]);
  }

  function applyProps(dom, oldProps, newProps, svg) {
    var name;

    for (name in oldProps) {
      if (name in newProps) continue;
      if (isHandler(name) && typeof oldProps[name] === 'function') {
        dom.removeEventListener(eventName(name), oldProps[name]);
      } else if (name === 'style') {
        dom.removeAttribute('style');
      } else if (AS_PROPERTY[name] && !svg) {
        if (name === 'value') dom.value = '';
        else dom[name] = false;
      } else {
        dom.removeAttribute(ALIAS[name] || name);
      }
    }

    for (name in newProps) {
      var next = newProps[name];
      var prev = oldProps[name];

      if (isHandler(name)) {
        if (prev === next) continue;
        if (typeof prev === 'function') dom.removeEventListener(eventName(name), prev);
        if (typeof next === 'function') dom.addEventListener(eventName(name), next);
      } else if (name === 'style') {
        applyStyle(dom, prev, next);
      } else if (AS_PROPERTY[name] && !svg) {
        if (name === 'value') {
          var v = next === null || next === undefined ? '' : String(next);
          if (dom.value !== v) dom.value = v;
        } else {
          dom[name] = !!next;
        }
      } else if (prev === next) {
        continue;
      } else if (next === null || next === undefined || next === false) {
        dom.removeAttribute(ALIAS[name] || name);
      } else {
        // SVG attribute names are case-sensitive (viewBox), so they pass
        // through untouched; the alias table only covers HTML.
        dom.setAttribute(ALIAS[name] || name, next === true ? '' : String(next));
      }
    }
  }

  /* -------------------------------------------------------------------------
     Instances

     One instance per rendered node, mirroring the DOM. A component or fragment
     owns no DOM of its own, so `domNodes` walks through it to whatever its
     descendants produced.
  ------------------------------------------------------------------------- */

  function domNodes(inst, out) {
    if (inst.kind === 'text' || inst.kind === 'host') out.push(inst.dom);
    else if (inst.kind === 'component') domNodes(inst.child, out);
    else for (var i = 0; i < inst.children.length; i++) domNodes(inst.children[i], out);
    return out;
  }

  function renderComponent(inst) {
    var previous = current;
    var previousIndex = hookIndex;
    current = inst;
    hookIndex = 0;

    var props = inst.vnode.props;
    if (inst.vnode.children.length) {
      props = Object.assign({}, props, { children: inst.vnode.children });
    }

    var out;
    try {
      out = inst.vnode.type(props);
    } finally {
      current = previous;
      hookIndex = previousIndex;
    }
    // A component returning null renders nothing; an empty text node is the
    // simplest way to hold its place in the child list.
    return out === null || out === undefined || out === false ? '' : out;
  }

  function create(vnode, root, svg) {
    if (typeof vnode !== 'object') {
      var text = String(vnode);
      return { kind: 'text', key: null, type: '#text', text: text, dom: document.createTextNode(text) };
    }

    if (vnode.type === Fragment) {
      var frag = { kind: 'fragment', key: vnode.key, type: Fragment, vnode: vnode, root: root, children: [] };
      frag.children = vnode.children.map(function (c) { return create(c, root, svg); });
      return frag;
    }

    if (typeof vnode.type === 'function') {
      var comp = { kind: 'component', key: vnode.key, type: vnode.type, vnode: vnode, root: root, hooks: [], child: null };
      comp.child = create(renderComponent(comp), root, svg);
      return comp;
    }

    var inSvg = svg || vnode.type === 'svg';
    var dom = inSvg ? document.createElementNS(SVG_NS, vnode.type) : document.createElement(vnode.type);
    var host = { kind: 'host', key: vnode.key, type: vnode.type, vnode: vnode, root: root, dom: dom, svg: inSvg, ref: null, children: [] };

    applyProps(dom, {}, vnode.props, inSvg);
    host.children = vnode.children.map(function (c) { return create(c, root, inSvg); });
    var nodes = [];
    for (var i = 0; i < host.children.length; i++) domNodes(host.children[i], nodes);
    for (var j = 0; j < nodes.length; j++) dom.appendChild(nodes[j]);

    if (vnode.ref) { vnode.ref.current = dom; host.ref = vnode.ref; }
    return host;
  }

  function update(inst, vnode, root, svg) {
    if (inst.kind === 'text') {
      var text = String(vnode);
      if (inst.text !== text) { inst.text = text; inst.dom.nodeValue = text; }
      return inst;
    }

    if (inst.kind === 'fragment') {
      inst.vnode = vnode;
      inst.children = reconcileList(inst.children, vnode.children, root, svg);
      return inst;
    }

    if (inst.kind === 'component') {
      inst.vnode = vnode;
      var out = renderComponent(inst);
      inst.child = reconcileList([inst.child], [out], root, svg)[0];
      return inst;
    }

    applyProps(inst.dom, inst.vnode.props, vnode.props, inst.svg);
    inst.vnode = vnode;
    inst.children = reconcileList(inst.children, vnode.children, root, inst.svg);
    place(inst.dom, inst.children);

    if (vnode.ref && vnode.ref !== inst.ref) {
      if (inst.ref) inst.ref.current = null;
      vnode.ref.current = inst.dom;
      inst.ref = vnode.ref;
    }
    return inst;
  }

  function unmount(inst) {
    if (!inst) return;
    if (inst.kind === 'component') {
      for (var i = 0; i < inst.hooks.length; i++) {
        if (inst.hooks[i] && inst.hooks[i].cleanup) runCleanup(inst.hooks[i]);
      }
      unmount(inst.child);
    } else if (inst.kind === 'host' || inst.kind === 'fragment') {
      for (var j = 0; j < inst.children.length; j++) unmount(inst.children[j]);
      if (inst.ref) inst.ref.current = null;
    }
  }

  /**
   * Match new children against old ones: by key where the app supplied one,
   * otherwise by position among the unkeyed. Anything left over is unmounted,
   * which is where effect cleanups run.
   */
  function reconcileList(oldList, vnodes, root, svg) {
    var taken = new Array(oldList.length);
    var picks = new Array(vnodes.length);
    var byKey = {};
    var i;

    for (i = 0; i < oldList.length; i++) {
      if (oldList[i].key !== null && oldList[i].key !== undefined) byKey[oldList[i].key] = i;
    }

    for (i = 0; i < vnodes.length; i++) {
      var key = keyOf(vnodes[i]);
      picks[i] = -1;
      if (key !== null && key !== undefined && byKey[key] !== undefined) {
        var at = byKey[key];
        if (!taken[at] && oldList[at].type === typeOf(vnodes[i])) {
          picks[i] = at;
          taken[at] = true;
        }
      }
    }

    var cursor = 0;
    for (i = 0; i < vnodes.length; i++) {
      if (picks[i] >= 0 || keyOf(vnodes[i]) !== null) continue;
      while (cursor < oldList.length && (taken[cursor] || oldList[cursor].key !== null)) cursor++;
      if (cursor < oldList.length && oldList[cursor].type === typeOf(vnodes[i])) {
        picks[i] = cursor;
        taken[cursor] = true;
        cursor++;
      }
    }

    var out = new Array(vnodes.length);
    for (i = 0; i < vnodes.length; i++) {

function App() {
const [screen, setScreen] = useState('start');

const [gameKey, setGameKey] = useState(null);
const [gameLabel, setGameLabel] = useState('');
// What the shared grid calls this game. Usually the same as gameLabel, but
// an archived dive drops the date from it — the grid stamps the date itself.
const [shareName, setShareName] = useState('');
// Which puzzle day this game is, for the share stamp and the archive record.
// Only the Daily Dive sets it; a themed game belongs to no particular day.
const [puzzleKey, setPuzzleKey] = useState(null);
const [session, setSession] = useState([]);
const [totalPrompts, setTotalPrompts] = useState(MIXED_ROUNDS);

const [idx, setIdx] = useState(0);
const [score, setScore] = useState(0);
const [log, setLog] = useState([]);
const [timeLeft, setTimeLeft] = useState(ROUND_SECONDS);
const [locked, setLocked] = useState(false);
const [inputValue, setInputValue] = useState('');
const [retryMsg, setRetryMsg] = useState('');
const [feedback, setFeedback] = useState(null);
const [copyLabel, setCopyLabel] = useState('Copy result');
// Answers already used this game, normalized. A ref, not state: nothing
// renders from it directly and it must be readable synchronously on submit.
const usedRef = useRef(new Set());
const inputRef = useRef(null);
const timerRef = useRef(null);
const cat = session[idx];
function startGame(m, key) {
const picked = pickSession(m, key);
setMode(m);
setGameKey(key || null);
setGameLabel(picked.label);
setShareName(picked.shareName || picked.label);
setPuzzleKey(picked.puzzleKey || null);
setSession(picked.list);
setTotalPrompts(picked.total);
setRoundPlan(picked.roundPlan);
setIdx(0);
setScore(0);
setLog([]);
usedRef.current = new Set();
setFeedback(null);
setRetryMsg('');
setInputValue('');
setLocked(false);
setTimeLeft(ROUND_SECONDS);

}
function goToMenu() {
clearInterval(timerRef.current);
setScreen('start');
}
// Countdown ticker: restarts whenever a new, unlocked prompt is shown.
useEffect(() => {
if (screen !== 'game' || locked) return;

const id = setInterval(() => setTimeLeft((t) => t - 1), 1000);
timerRef.current = id;
return () => clearInterval(id);
}, [idx, screen, locked]);
// When the clock runs out, end the round.
useEffect(() => {
if (screen !== 'game' || locked) return;
if (timeLeft <= 0) {
clearInterval(timerRef.current);
endPrompt('timeout');
}
}, [timeLeft]);
useEffect(() => {
if (screen === 'game' && !locked) focusEl(inputRef);
}, [idx, screen, locked]);
function rejectAnswer(message) {
playReject();
setRetryMsg(message);
setInputValue('');
focusEl(inputRef);
}
function constraintFailure(spec, entry) {
const reason = violatesConstraint(spec, entry);
if (!reason) return null;
if (reason === 'era') {
return '🕰️ “' + entry.name + '” is real, but it’s from ' + entry.year +
' — this round wants one from ' + eraLabelText(spec.buckets, spec.value) + '. Try another!';
}
if (reason === 'role') {
const wanted = spec.value === 'actor' ? 'a real actor' : 'a character name';
return '🎭 “' + entry.name + '” is real, but that’s ' +
(entry.role === 'actor' ? 'an actor' : 'a character') +
' — this round wants ' + wanted + '. Try another!';
}
if (reason === 'initial') {
return '🔤 “' + entry.name + '” is real, but it starts with ' +
firstLetter(entry.name) + ' — this round wants one starting with ' +
spec.value + '. Try another!';
}
if (reason === 'words') {
return '✂️ “' + entry.name + '” is real, but it’s ' + wordCount(entry.name) +
(wordCount(entry.name) === 1 ? ' word' : ' words') + ' — this round wants ' +
(spec.value === 'one' ? 'a single word' : 'four or more') + '. Try another!';
}
if (reason === 'decade') {
return '📅 “' + entry.name + '” is real, but it’s ' + entry.year +
' — this round wants the ' + spec.value + 's. Try another!';
}
return '🎟️ “' + entry.name + '” is real, but at +' + TIERS[entry.tier].points +
' it’s too well known — this round takes deep cuts, worth +' +
TIERS[spec.minTier].points + ' or more. Try a rarer one!';
}
function attemptSubmit() {
if (locked) return;
const raw = inputValue;
if (!raw.trim()) {
playReject();
setRetryMsg('Type an answer, or hit “skip this prompt” to move on.');
return;
}
const result = matchInput(cat, raw);
if (result.type !== 'match') {
rejectAnswer('❌ “' + raw.trim() + '” doesn’t match anything in this category — try another answer!');
return;
}
const entry = result.entry;
const failure = constraintFailure(roundPlan && roundPlan.rounds[idx], entry);
if (failure) {
rejectAnswer(failure);
return;
}
const key = normalize(entry.name);
if (usedRef.current.has(key)) {
playReject();
// Select rather than clear: they typed a real answer, just not a new one.
setRetryMsg('🔁 You already used “' + entry.name + '” this game — name a different one!');

}
function finalizePrompt(tierInfo, matchedLabel, raw, correction, dedupeKey) {

clearInterval(timerRef.current);
setRetryMsg('');
// TIERS holds the real tier objects, so indexOf identifies which one this
// is; MISS is not in that array and comes back -1.
const tierIndex = TIERS.indexOf(tierInfo);
if (tierIndex >= 0) playAnswer(tierIndex);
else playMiss();
if (dedupeKey) usedRef.current.add(dedupeKey);
setScore((s) => s + tierInfo.points);
// catId and spec are carried so the result screen can work out what else
// would have counted; answerName is null on a miss, where matchedLabel is
// a status line ("Time's up") rather than a film.
setLog((l) => [...l, {
category: cat.title,
catId: cat.id,
spec: (roundPlan && roundPlan.rounds[idx]) || null,
answerName: tierIndex >= 0 ? matchedLabel : null,
input: raw,
matched: matchedLabel,
tier: tierInfo,

}
function nextPrompt() {

playResult(score, maxScore(totalPrompts));
// Recorded here rather than on the result screen, which re-renders: this
// runs exactly once, when the last round closes.
recordResult(puzzleKey, score, totalPrompts);

}
setIdx(nextIdx);
setFeedback(null);
setRetryMsg('');
setInputValue('');
setLocked(false);
}
function flashCopied() {
setCopyLabel('Copied!');
setTimeout(() => setCopyLabel('Copy result'), 1500);
}
function handleCopy(text) {

} else {
fallbackCopy(text);
}
}
// navigator.clipboard is unavailable on insecure origins (plain file:// too).
function fallbackCopy(text) {

ta.value = text;
document.body.appendChild(ta);
ta.select();

document.execCommand('copy');

} catch (e) {
}
document.body.removeChild(ta);
}
return h(
React.Fragment,
null,
h(TopHeader),
screen === 'start'
? h(StartScreen, {
onStartDaily: (id) => startGame('daily', id),
onStartPractice: () => startGame('practice'),
onStartArchived: (dayKey) => startGame('practice', dayKey),
})
: null,
screen === 'game'
? h(GameScreen, {
idx, totalPrompts, score, timeLeft, mode, roundPlan, cat, gameLabel,
inputValue, setInputValue,
onSubmit: attemptSubmit,
onSkip: () => endPrompt('skip'),
onQuit: goToMenu,
retryMsg, feedback, locked, inputRef,
onNext: nextPrompt,
})
: null,
screen === 'result'
? h(ResultScreen, {
mode, gameLabel, shareName, score, totalPrompts, log, puzzleKey,
// A daily show is the same all day, so replaying it would just repeat
// the same five questions — send them to the Daily Dive instead.
onReplay: () => (mode === 'daily' ? startGame('practice') : startGame(mode, gameKey)),
onBackToMenu: goToMenu,
copyLabel,
onCopy: handleCopy,
})
: null,
h(AboutFooter)
);
}
const root = window.ReactDOMClient.createRoot(document.getElementById('root'));
root.render(h(App));
</script>
