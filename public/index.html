<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Paths are root-relative to the served tree, not to this file: serve.ps1
     serves the repo root and hands back public/index.html for "/", so these
     resolve to /src/... in the browser. -->
<link rel="stylesheet" href="src/css/tokens.css">
<link rel="stylesheet" href="src/css/base.css">
<link rel="stylesheet" href="src/css/components.css">
<link rel="stylesheet" href="src/css/screens.css">
</head>
<body>
<div class="wrap" id="root"><p class="boot">Loading Bollybuzz.io</p></div>

<!-- The renderer defines window.React / window.ReactDOMClient before the app
     module runs. `defer` keeps it ahead of the module below. -->
<script src="src/vendor/mini-react.js" defer></script>
<script type="module" src="src/js/main.js"></script>
</body>
</html>
