<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bollybuzz.io — 10 Bollywood Trivia Games Where Rare Answers Win</title>
<meta name="description" content="Name one answer per prompt. The rarer your answer, the deeper you dive into 113 years of Hindi cinema." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Tints the browser chrome on mobile to match the page ground. Kept in step
     with --ink in tokens.css; it was still the old grey after the redesign,
     which put a light bar above a dark page. -->
<meta name="theme-color" content="#150F38">

<!-- Paths are root-relative to the served tree, not to this file: serve.ps1
     serves the repo root and hands back public/index.html for "/", so these
     resolve to /src/... in the browser. -->
<!-- THIS FILE IS NOT THE ONE TO DEPLOY. It is the development shell: it loads
     the modules under src/ from the tree beside it, so it only works behind a
     server rooted at the REPO ROOT (server/serve.ps1 does that, and maps "/"
     here). Published on its own it shows the boot line below and nothing else,
     because every path it points at 404s.

     Deploy docs/index.html instead - the whole game in one self-contained
     file. Vercel defaults its output directory to public/ when that folder
     exists, which is why vercel.json overrides it. See the README.

     Cascade order: tokens define, base grounds, components style the pieces,
     then one stylesheet per screen. Keep in step with $cssFiles in build.ps1,
     which flattens these in the same order. -->
<link rel="stylesheet" href="src/css/tokens.css">
<link rel="stylesheet" href="src/css/base.css">
<link rel="stylesheet" href="src/css/components.css">
<link rel="stylesheet" href="src/css/screen-start.css">
<link rel="stylesheet" href="src/css/screen-game.css">
<link rel="stylesheet" href="src/css/screen-result.css">
</head>
<body>
<div class="wrap" id="root"><p class="boot">Loading Bollybuzz.io</p></div>

<!-- The renderer defines window.React / window.ReactDOMClient before the app
     module runs. `defer` keeps it ahead of the module below. -->
<script src="src/vendor/mini-react.js" defer></script>
<script type="module" src="src/js/main.js"></script>
</body>
</html>
